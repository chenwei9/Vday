<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#12070d" />
  <title>給你一束花 ❤️</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="shade"></div>

    <section id="intro" class="intro">
      <div class="heart">♥</div>
      <h1>有個小東西想送你</h1>
      <p>打開鏡頭，伸出一隻手看看。</p>
      <button id="startBtn">打開鏡頭</button>
      <small>鏡頭畫面只在你的裝置上即時處理。</small>
    </section>

    <div id="hint" class="hint hidden">
      <span id="hintText">把手放進畫面，然後握拳 ✊</span>
    </div>

    <section id="message" class="message">
      <div class="sparkle">✦</div>
      <p>Happy Valentine's Day</p>
      <h2>這束花送給你 ❤️</h2>
    </section>

    <div id="loading" class="loading hidden">正在準備魔法…</div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
